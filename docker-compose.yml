# rip-maf — backend-only agentic RAG stack. Open WebUI runs separately
# (standalone or its own compose) and reaches `backend` after joining
# `rip-maf-net`:  docker network connect rip-maf-net open-webui
services:
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    ports:
      # Loopback-bound: the Open WebUI Pipe reaches the backend over the
      # private network, so the API is never exposed to the LAN.
      - "127.0.0.1:${HOST_BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./.env
        required: false
    environment:
      DB_HOST: rip-maf-postgres-1
      DB_PORT: 5432
      PORT: 8000
      NO_PROXY: postgres,backend,host.docker.internal,127.0.0.1,localhost
      no_proxy: postgres,backend,host.docker.internal,127.0.0.1,localhost
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RIP_SERVICE_KEY: ${RIP_SERVICE_KEY:-}
      # Container-path facts: host BGE weights are mounted at /app/models.
      BGE_M3_MODEL_PATH: /app/models/bge-m3
      BGE_RERANKER_V2_M3: /app/models/reranker/bge_reranker_v2_m3
      UPLOAD_DIR: /app/uploads
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3002}
    volumes:
      - ${BGE_MODELS_DIR:-./models}:/app/models:ro
      - uploads:/app/uploads
    restart: unless-stopped
    mem_limit: ${BACKEND_MEM:-8g}
    cpus: ${BACKEND_CPUS:-2.0}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rip-maf-net

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-ripmaf}
      POSTGRES_USER: ${DB_USER:-ripmaf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ripmafpass}
    ports:
      - "127.0.0.1:${HOST_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rip-maf-net

volumes:
  pgdata:
  uploads:

networks:
  rip-maf-net:
    driver: bridge
